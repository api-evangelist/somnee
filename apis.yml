name: Somnee
description: >-
  Somnee is a consumer sleep-technology company behind a smart sleep headband that uses
  personalized neurostimulation to improve sleep. Developed over roughly eight years by a
  team of UC Berkeley neuroscientists (co-founders include sleep scientist Dr. Matthew Walker,
  Dr. Robert T. Knight, Dr. Rich Ivry, and CSTO Dr. Ram Gurumoorthy, with CEO Tim Rosa, former
  Fitbit CMO), the wearable pairs clinical-grade EEG+ sensors with a companion app and
  proprietary AI to deliver a 15-minute pre-bedtime session that the company says helps users
  fall asleep about 50% faster and cut nighttime wake-ups by roughly a third, without medication.
  Somnee sells the headband, accessories, and a sleep-service membership direct to consumers,
  and is backed by Khosla Ventures. Somnee publishes no public API or developer platform.
